[package]
name = "rdfc-rust-runner"
version = "0.3.0"
edition.workspace = true
description = "Rust runner implementation for RDF-Connect"
license.workspace = true
repository.workspace = true

[[bin]]
name = "rust-runner"
path = "src/main.rs"

[lib]
name = "rdfc_rust_runner"
path = "src/lib.rs"

[dependencies]
rdfc-processor-sdk = { workspace = true }
abi_stable = { workspace = true }
async-ffi = { workspace = true, features = ["abi_stable"] }

tonic    = { version = "0.12", features = ["transport"] }
prost    = "0.13"
prost-types = "0.13"
tokio    = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
bytes    = "1"
http     = "1"

serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
anyhow        = "1"
tracing       = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

async-trait = "0.1"
sha2 = "0.11.0"
reqwest = "0.13.4"
dirs = "6.0.0"

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tokio-test  = "0.4"
tokio-stream = { version = "0.1", features = ["net"] }
