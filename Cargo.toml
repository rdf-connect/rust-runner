[package]
name = "runner"
version = "0.1.0"
edition = "2021"

[dependencies]
futures = "0.3.31"
prost = "0.13.5"
prost-types = "0.13.5"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
tokio = { version = "1.43.0", features = ["rt", "rt-multi-thread"] }
tokio-stream = "0.1.17"
tonic = "0.12.3"

[build-dependencies]
prost-build = "0.13.5"
tonic-build = "0.12.3"
