[workspace]
members = [
    "processor-sdk",
    "processor-buildtools",
    "runner",
    "processors/echo",
    "processors/log",
    "processors/send",
    "processors/multi",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/rdf-connect/rust-runner"

# Pinned exactly: the abi_stable / async-ffi versions here define the plugin
# ABI. The runner and every processor cdylib must be built against the exact
# same versions, or `abi_stable`'s layout check will refuse to load the
# library (see processor-sdk's ABI_TOKEN doc comment).
[workspace.dependencies]
abi_stable = "=0.11.3"
async-ffi = "=0.5.0"
rdfc-processor-sdk = { path = "processor-sdk", version = "0.3.0" }
rdfc-processor-buildtools = { path = "processor-buildtools", version = "0.3.0" }
