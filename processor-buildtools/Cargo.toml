[package]
name = "rdfc-processor-buildtools"
version.workspace = true
edition.workspace = true
description = "Build-time and CI tooling that generates a processor's :artifact/:abiStable manifest"
license.workspace = true
repository.workspace = true

[lib]
name = "rdfc_processor_buildtools"
path = "src/lib.rs"

[[bin]]
name = "rdfc-processor-buildtools"
path = "src/main.rs"

[dependencies]
rdfc-processor-sdk = { workspace = true }
oxttl = "0.2"
oxrdf = "0.3"
sha2 = "0.11.0"
anyhow = "1"
