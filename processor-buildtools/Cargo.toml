[package]
name = "rdfc-processor-buildtools"
version = "0.1.0"
edition = "2021"
description = "Build-time and CI tooling that generates a processor's :artifact/:abiStable manifest"
license = "MIT"

[lib]
name = "rdfc_processor_buildtools"
path = "src/lib.rs"

[[bin]]
name = "rdfc-processor-buildtools"
path = "src/main.rs"

[dependencies]
rdfc-processor-sdk = { path = "../processor-sdk" }
oxttl = "0.2"
oxrdf = "0.3"
sha2 = "0.11.0"
anyhow = "1"
