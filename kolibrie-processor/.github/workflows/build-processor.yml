name: Build and publish processor

# Builds this processor as a `cdylib` for every target triple in the matrix
# below, computes each artifact's SHA-256 checksum, substitutes the real
# checksums into processor.ttl's `:artifact` table (checked in with
# placeholder zeros — see processor.ttl for why), and publishes everything
# together to a GitHub Release: the shared libraries plus the one
# processor.ttl that describes how to find them.
#
# The rdfc-rust-runner picks the right artifact at pipeline-startup time by
# matching its own compiled target triple against processor.ttl's
# `:targetTriple` entries, downloads it (caching by `:sha256`), and loads it
# via `abi_stable`.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  CRATE_NAME: rdfc_processor_kolibrie

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: so
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            ext: so
            cross_linker: aarch64-linux-gnu-gcc
            cross_apt_package: gcc-aarch64-linux-gnu
          - target: x86_64-apple-darwin
            os: macos-13
            ext: dylib
          - target: aarch64-apple-darwin
            os: macos-14
            ext: dylib

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation linker
        if: matrix.cross_apt_package != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.cross_apt_package }}
          echo "CARGO_TARGET_$(echo ${{ matrix.target }} | tr '[:lower:]-' '[:upper:]_')_LINKER=${{ matrix.cross_linker }}" >> "$GITHUB_ENV"

      - name: Build cdylib
        run: cargo build --release --locked --target ${{ matrix.target }}

      # abi_stable pins its own ABI per version; rebuilding against anything
      # other than the workspace-pinned version here would produce a library
      # the runner refuses to load (see rdfc_processor_sdk::ABI_TOKEN). Cargo.lock
      # is committed and `--locked` above enforces this at build time.

      - name: Rename artifact and compute checksum
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          src="target/${{ matrix.target }}/release/lib${CRATE_NAME}.${{ matrix.ext }}"
          name="lib${CRATE_NAME}-${{ matrix.target }}.${{ matrix.ext }}"
          cp "$src" "$name"
          sha256=$(shasum -a 256 "$name" | cut -d' ' -f1)
          echo "filename=$name" >> "$GITHUB_OUTPUT"
          printf '%s %s %s\n' "${{ matrix.target }}" "$sha256" "$name" > "checksum-${{ matrix.target }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.target }}
          path: ${{ steps.artifact.outputs.filename }}

      - uses: actions/upload-artifact@v4
        with:
          name: checksum-${{ matrix.target }}
          path: checksum-${{ matrix.target }}.txt

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: artifact-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v4
        with:
          pattern: checksum-*
          merge-multiple: true
          path: checksums

      - name: Render processor.ttl with real checksums
        run: |
          set -euo pipefail
          cp processor.ttl dist/processor.ttl
          while read -r target sha256 filename; do
            [ -z "$target" ] && continue
            python3 - "$sha256" "$filename" dist/processor.ttl <<'PYEOF'
import re, sys

sha256, filename, ttl_path = sys.argv[1:4]
with open(ttl_path) as f:
    text = f.read()

# Each artifact block has exactly one `:path "<filename>" ; :sha256 "0..0"`
# pair in the checked-in template; replace that placeholder with the real,
# just-computed checksum for this target's file.
pattern = re.compile(
    r'(:path\s+"' + re.escape(filename) + r'"\s*;\s*:sha256\s+")0+(")'
)
text, n = pattern.subn(lambda m: m.group(1) + sha256 + m.group(2), text)
if n != 1:
    sys.exit(f"expected exactly one sha256 placeholder for {filename!r}, patched {n}")
with open(ttl_path, "w") as f:
    f.write(text)
PYEOF
          done < <(cat checksums/checksum-*.txt)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
