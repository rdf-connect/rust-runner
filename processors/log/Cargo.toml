[package]
name = "rdfc-processor-log"
version.workspace = true
edition.workspace = true
description = "Log processor for RDF-Connect: logs messages passing through a pipeline"
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rdfc-processor-sdk = { workspace = true }
serde = { version = "1", features = ["derive"] }
# `abi_stable`'s `#[export_root_module]` macro expands to code with an
# absolute `::abi_stable::...` path, so it must be a direct dependency here
# even though `rdfc-processor-sdk` re-exports the crate.
abi_stable = { workspace = true }

[build-dependencies]
rdfc-processor-buildtools = { workspace = true }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }
