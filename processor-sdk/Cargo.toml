[package]
name = "rdfc-processor-sdk"
version.workspace = true
edition.workspace = true
description = "Shared SDK types for RDF-Connect Rust processor plugins"
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
futures = "0.3"
bytes = "1"
abi_stable = { workspace = true }
async-ffi = { workspace = true, features = ["abi_stable"] }
linkme = "0.3"
