[package]
name = "rdfc-processor-sdk"
version = "0.1.0"
edition = "2021"
description = "Shared SDK types for RDF-Connect Rust processor plugins"
license = "MIT"

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }
futures = "0.3"
